# Host nginx vhost for the home-site container (Compose publishes 127.0.0.1:3002).
# Does not replace the Antler site on 156.38.220.234.
#
#   sudo cp deploy/nginx/goodcode.co.za.conf /etc/nginx/sites-available/goodcode.co.za
#   sudo ln -s /etc/nginx/sites-available/goodcode.co.za /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Point DNS A records for goodcode.co.za and www.goodcode.co.za at 156.38.220.234.
# TLS later (install first if missing):
#   sudo apt update && sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d goodcode.co.za -d www.goodcode.co.za

server {
    listen 80;
    listen [::]:80;
    server_name goodcode.co.za www.goodcode.co.za;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# After certificates exist, certbot will typically add a listen 443 ssl server
# and you can redirect HTTP:
#
